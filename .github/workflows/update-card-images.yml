name: Update card image index

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/update-card-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-card-image-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build card image index from permitted catalog
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from html import unescape

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "img":
                      return
                  a = dict(attrs)
                  src = a.get("src", "")
                  alt = unescape(a.get("alt", "")).strip()
                  match = re.search(r"(?:[?&])src=(\d+)\.jpg", src)
                  if match and alt:
                      name = re.sub(r"^Image:\s*", "", alt)
                      name = re.sub(r"のカード画像$", "", name).strip()
                      if name:
                          self.items.append((name, int(match.group(1))))

          cards = {}
          for page in range(1, 10):
              url = f"https://mushijingi.com/index.php?order=no&page={page}&sort=ASC"
              request = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; CardImageIndex/1.0)"})
              with urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", "replace")
              parser = Images()
              parser.feed(html)
              for name, number in parser.items:
                  cards[name] = f"https://mushijingi.com/images/card/thumbnail.php?height=300&src={number}.jpg&width=225"
              time.sleep(0.5)

          if len(cards) < 500:
              raise SystemExit(f"Expected at least 500 card images, found {len(cards)}. Keeping existing index unchanged.")

          with open("card-images.json", "w", encoding="utf-8") as f:
              json.dump(cards, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Saved {len(cards)} card image mappings.")
          PY
      - name: Commit generated image index
        run: |
          test -f card-images.json
          git add card-images.json
          if git diff --cached --quiet; then
            echo "No card image index changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update full card image index"
          git push
